name: BAATCHEET CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      IMAGE_VERSION: ver-0.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test -- --run
        working-directory: backend  
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-key-at-least-32-characters-long
          MONGODB_URI: mongodb://127.0.0.1:27017/baatcheet_test
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: test-api-key
          CLOUDINARY_API_SECRET: test-api-secret

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Create CI environment file
        run: |
          touch backend/.env

      - name: Build Docker images
        run: docker compose build

      - name: List Docker images
        run: docker images

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag baatcheet-app-backend:latest piyush5624/baatcheet-backend:${IMAGE_VERSION}
          docker tag baatcheet-app-frontend:latest piyush5624/baatcheet-frontend:${IMAGE_VERSION}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker push piyush5624/baatcheet-backend:${IMAGE_VERSION}
          docker push piyush5624/baatcheet-frontend:${IMAGE_VERSION}


      - name: Deploy Backend to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"imageUrl\":\"docker.io/piyush5624/baatcheet-backend:${IMAGE_VERSION}\"}"
