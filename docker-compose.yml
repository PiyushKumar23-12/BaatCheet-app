services:
  backend:
    build:
      context: ./backend
    container_name: baatcheet-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    volumes:
      - baatcheet_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: 
      context: ./frontend
    container_name: baatcheet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend


volumes:
  baatcheet_mongodb_data: